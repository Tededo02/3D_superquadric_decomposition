[project]
name = "superquadric-decomposition"
version = "0.1.0"
description = "Multi-model superquadric decomposition of 3D point clouds via GAIR-RANSAC with set-cover model selection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numba>=0.64.0",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "point-cloud-utils>=0.34.0",
    "pymaxflow>=1.3.2",
    "pyvista[jupyter]>=0.49.0",
    "scipy>=1.17.1",
    "trimesh>=4.11.3",
    # notebook front end and PyVista's inline 3D backend
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
]
